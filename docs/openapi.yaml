openapi: 3.1.0
info:
  title: ODAS API
  version: 1.0.0
  description: |
    Marketplace data API exposing catalogue metadata from Firestore
    and SQL/export access over the BigQuery datasets odas_bronze, odas_silver and odas_gold.
    The Firestore `data_catalogue` collection uses V2 layout:
    one document per table id plus `_catalogue_meta`.
    `field_docs` contains documentation only, while runtime schema
    authority comes from the BigQuery table metadata.
servers:
  - url: https://odace.services.d4g.fr
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
  /api/me:
    get:
      summary: Current user information
      security:
        - HTTPBearer: []
      responses:
        "200":
          description: User profile
  /api/data/catalog:
    get:
      summary: Full data catalogue (bronze/silver/gold index)
      security:
        - HTTPBearer: []
      responses:
        "200":
          description: Catalogue
  /api/data/catalog/silver:
    get:
      summary: Silver catalogue with descriptions and stats
      security:
        - HTTPBearer: []
      responses:
        "200":
          description: Silver catalogue
  /api/data/catalog/silver/{table_name}:
    get:
      summary: Silver table details
      security:
        - HTTPBearer: []
      parameters:
        - in: path
          name: table_name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Table details
  /api/data/table/{layer}/{table}:
    get:
      summary: Live schema for one table
      security:
        - HTTPBearer: []
      parameters:
        - in: path
          name: layer
          required: true
          schema:
            type: string
            enum: [bronze, silver, gold]
        - in: path
          name: table
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Table schema
  /api/data/preview/{layer}/{table}:
    post:
      summary: Table preview with optional filters/sort
      security:
        - HTTPBearer: []
      parameters:
        - in: path
          name: layer
          required: true
          schema:
            type: string
            enum: [bronze, silver, gold]
        - in: path
          name: table
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Table preview
  /api/data/query:
    post:
      summary: Execute SQL query
      description: |
        Runs one BigQuery SQL (GoogleSQL) SELECT statement. Silver tables are
        referenced by name (`dim_commune`) or as `odas_silver.dim_commune`; admins
        may also read `odas_bronze.<table>` and `odas_gold.<table>`. Paginate with
        `offset`: results are cached, so the next pages are not billed again.
        Answers 429 once the API's daily query budget is used up.
      security:
        - HTTPBearer: []
      responses:
        "200":
          description: Query result page
  /api/data/export/{table}:
    get:
      summary: Export full silver table
      security:
        - HTTPBearer: []
      parameters:
        - in: path
          name: table
          required: true
          schema:
            type: string
        - in: query
          name: format
          required: false
          schema:
            type: string
            enum: [csv, parquet]
      responses:
        "200":
          description: Streamed export
  /api/data/catalog/refresh:
    post:
      summary: Refresh catalogue sync metadata
      security:
        - HTTPBearer: []
      responses:
        "200":
          description: Refresh status
  /admin/runtime-cache/invalidate:
    post:
      summary: Invalidate the runtime cache
      description: |
        Admin endpoint dropping this instance's cached BigQuery table listings
        and Firestore catalogue. Send `{ "all": true }`, or
        `{ "layer": "silver", "table_name": "..." }`; the whole cache is
        dropped in both cases.
      security:
        - HTTPBearer: []
      responses:
        "200":
          description: Cache invalidation status
components:
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
